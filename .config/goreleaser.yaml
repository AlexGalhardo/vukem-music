# Matches Vukem's release asset layout. Frontend/score assets are built first.
version: 2
project_name: vukem-music

builds:
  - id: vukem-music
    main: ./cmd/app
    binary: vukem-music
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }} -X main.commit={{ .FullCommit }} -X main.date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - name_template: "vukem-music_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE.md
      - README.md
      - CHANGELOG.md
      - THIRD_PARTY_NOTICES.md
      - .env.example
      - docs/releases.md
      - scores/manifest.json
      - scores/sources/*.ly

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

release:
  draft: true
  replace_existing_artifacts: true
  mode: keep-existing
  prerelease: auto
